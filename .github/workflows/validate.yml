name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned upstreams
        run: python3 scripts/sync_upstreams.py
      - name: Compile Python
        run: python3 -m py_compile retrieval/*.py scripts/*.py eval/*.py eval/task_gain/*.py eval/task_gain_v2/*.py
      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts or 'vendor' in p.parts: continue
              json.loads(p.read_text(encoding='utf-8')); print('OK', p)
          PY
      - name: Build atomic routing benchmark
        run: python3 eval/build_atomic_benchmark.py
      - name: Benchmark harness dry run
        run: python3 eval/run_router_benchmark.py --dry-run
      - name: Held-out harness dry run
        run: |
          python3 eval/run_heldout_benchmark.py --architecture catalog-single --dry-run
          python3 eval/run_heldout_benchmark.py --architecture two-stage-v5 --dry-run
          python3 - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path('eval/heldout/router-heldout-v1.jsonl'); got=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='3ff1154048f2f2c3c218074d66bb8ece3d95257a0557c7c5a5c45f9c9d23cdfb'; assert got==expected; print('held-out SHA256 OK',got)
          PY
      - name: Task Gain v1 harness dry run
        run: |
          python3 eval/run_task_gain.py --dry-run
          python3 - <<'PY'
          import hashlib,json,pathlib
          freeze=json.loads(pathlib.Path('eval/task_gain/TASK_GAIN_FREEZE.json').read_text())
          for path,key in [('eval/task_gain/tasks-v1.jsonl','tasks_sha256'),('eval/task_gain/rubric-v1.json','rubric_sha256')]:
              got=hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest(); assert got==freeze[key]; print('task-gain v1 frozen input OK',path,got)
          PY
      - name: Runtime Skills v2 validation
        run: python3 scripts/validate_runtime_cards.py
      - name: Task Gain v2 harness dry run
        run: |
          python3 eval/run_task_gain_v2.py --dry-run
          python3 - <<'PY'
          import hashlib,json,pathlib
          freeze=json.loads(pathlib.Path('eval/task_gain_v2/TASK_GAIN_V2_FREEZE.json').read_text())
          def blob(path):
              data=pathlib.Path(path).read_bytes(); return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for path,key in [
              ('eval/task_gain_v2/tasks-v2.jsonl','tasks_git_blob'),
              ('eval/task_gain_v2/rubric-v2.json','rubric_git_blob'),
              ('skills/runtime/RUNTIME_CARDS.json','runtime_cards_git_blob'),
              ('skills/runtime/COMPOSITE_CARDS.json','composite_cards_git_blob')]:
              got=blob(path); assert got==freeze[key],(path,got,freeze[key]); print('task-gain v2 frozen input OK',path,got)
          PY
      - name: Build corpus index
        run: python3 retrieval/build_index.py
      - name: Build source manifest
        run: python3 scripts/build_source_manifest.py
      - name: Build skill evidence map
        run: python3 scripts/build_evidence_map.py
      - name: Evidence coverage report
        run: python3 eval/evidence_coverage.py
      - name: Static checks
        run: python3 eval/run_static_checks.py
      - name: Smoke-test retrieval
        run: |
          python3 retrieval/search.py catalog --volume 第一卷 >/tmp/catalog.json
          python3 retrieval/search.py search '调查' --limit 3 >/tmp/search.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/catalog.json')); assert json.load(open('/tmp/search.json')); print('retrieval smoke tests passed')
          PY
      - name: Upload evidence audit
        uses: actions/upload-artifact@v4
        with:
          name: evidence-audit
          path: |
            evidence/corpus-manifest.generated.json
            evidence/skill-source-map.generated.json
            eval/evidence-coverage.generated.json
      - name: Upload skill test audit
        uses: actions/upload-artifact@v4
        with:
          name: skill-test-audit
          path: |
            eval/atomic-test-inventory.generated.json
            eval/atomic-routing-benchmark.generated.jsonl
