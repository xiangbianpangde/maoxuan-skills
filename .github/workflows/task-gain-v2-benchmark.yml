name: task-gain-v2-benchmark

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: OpenAI-compatible base URL
        required: true
        default: https://api.minimaxi.com/v1
      model:
        description: Generation model
        required: true
        default: minimax-m3
      judge_model:
        description: Optional independent judge model; leave blank to reuse generation model
        required: false
        default: ''
      workers:
        description: Generation workers
        required: true
        default: '4'
      judge_workers:
        description: Judge workers
        required: true
        default: '2'
      no_response_format:
        description: Disable response_format JSON mode
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  task-gain-v2:
    runs-on: ubuntu-latest
    env:
      BENCH_BASE_URL: ${{ inputs.base_url }}
      BENCH_MODEL: ${{ inputs.model }}
      JUDGE_MODEL: ${{ inputs.judge_model }}
      BENCH_WORKERS: ${{ inputs.workers }}
      JUDGE_WORKERS: ${{ inputs.judge_workers }}
      BENCH_API_KEY: ${{ secrets.MAOXUAN_BENCH_API_KEY }}
      NO_RESPONSE_FORMAT: ${{ inputs.no_response_format }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned upstreams
        run: python3 scripts/sync_upstreams.py
      - name: Validate Runtime Skills v2
        run: python3 scripts/validate_runtime_cards.py
      - name: Verify frozen Task Gain v2 inputs
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          freeze=json.loads(pathlib.Path('eval/task_gain_v2/TASK_GAIN_V2_FREEZE.json').read_text())
          def blob(path):
              data=pathlib.Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for path,key in [
              ('eval/task_gain_v2/tasks-v2.jsonl','tasks_git_blob'),
              ('eval/task_gain_v2/rubric-v2.json','rubric_git_blob'),
              ('skills/runtime/RUNTIME_CARDS.json','runtime_cards_git_blob'),
              ('skills/runtime/COMPOSITE_CARDS.json','composite_cards_git_blob'),
          ]:
              got=blob(path); assert got==freeze[key], (path,got,freeze[key]); print('OK',path,got)
          PY
      - name: Build local corpus index
        run: python3 retrieval/build_index.py
      - name: Run Task Gain v2 benchmark
        run: |
          EXTRA=()
          if [ "$NO_RESPONSE_FORMAT" = "true" ]; then EXTRA+=(--no-response-format); fi
          JUDGE=()
          if [ -n "$JUDGE_MODEL" ]; then JUDGE+=(--judge-model "$JUDGE_MODEL"); fi
          python3 eval/run_task_gain_v2.py \
            --base-url "$BENCH_BASE_URL" \
            --api-key "$BENCH_API_KEY" \
            --model "$BENCH_MODEL" \
            --workers "$BENCH_WORKERS" \
            --judge-workers "$JUDGE_WORKERS" \
            --output eval/results/task-gain-v2.jsonl \
            "${JUDGE[@]}" \
            "${EXTRA[@]}"
      - name: Show summary
        run: cat eval/results/task-gain-v2.summary.json
      - name: Upload Task Gain v2 results
        uses: actions/upload-artifact@v4
        with:
          name: task-gain-v2-${{ github.run_id }}
          path: |
            eval/results/task-gain-v2.jsonl
            eval/results/task-gain-v2.summary.json
